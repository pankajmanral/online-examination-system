[SERVICE]
    flush     1
    log_level info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 8888

[INPUT]
    Name   http
    Tag    exam.logs
    Listen 0.0.0.0
    Port   8888

[OUTPUT]
    Name            es
    Match           *
    Host            elasticsearch
    Port            9200
    Index           exam-logs
    Logstash_Format On
    Logstash_Prefix exam-logs
    Retry_Limit     False
